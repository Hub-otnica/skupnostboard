services:
  skorbord:
    build: .
    ports:
      - "3000:3000"

    volumes:
      - ./server/data:/app/server/data
      - ./public/uploads/badges:/app/public/uploads/badges

    environment:
      NODE_ENV: development

    develop:
      watch:
        - path: .
          target: /app
          action: sync

    command: npm run dev
